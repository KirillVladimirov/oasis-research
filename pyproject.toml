[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oasis"
version = "0.1.0"
description = "Ontology-Augmented Survey Synthesis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "OASIS Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "streamlit>=1.31",
    "pymupdf>=1.23",
    "pdfminer.six>=20231228",
    "requests>=2.31",
    "tenacity>=8.2",
    "rapidfuzz>=3.6",
    "python-slugify>=8.0",
    "Unidecode>=1.3",
    "loguru>=0.7",
    "tqdm>=4.66",
    "feedparser>=6.0",
    "weaviate-client>=3.25",
    "sentence-transformers>=2.7",
    "FlagEmbedding>=1.2",
    "safetensors>=0.6.2",  # Требуется для безопасной загрузки моделей с PyTorch 2.3.1
    "transformers>=4.44.2,<4.46",  # Совместима с PyTorch 2.3.1, не требует PyTorch >=2.6
    "rdflib>=7.0",
    "owlready2>=0.44",
    "pyshacl>=0.23",
    "SPARQLWrapper>=2.0",
    "langgraph>=0.2",
    "litellm>=1.43",
    "langfuse>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "networkx>=3.2",
    "pandas>=2.0",
    "lxml>=5.0",
    # NumPy <2 требуется для совместимости с PyTorch 2.3.1 (см. ADR-0011)
    "numpy>=1.24,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "types-requests>=2.31.0",
    "types-python-slugify>=5.0.0",
    "coverage>=7.0",
    "ipython>=8.0",
    "ipdb>=0.13",
]

[project.scripts]
oasis-health = "scripts.check_services_health:main"

[tool.setuptools]
# Автоматический поиск пакетов (аналог find_packages())
packages = { find = {} }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "__pycache__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "oasis.egg-info",
    "weaviate_data",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101"]  # Allow assert statements in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Импорты
namespace_packages = true
explicit_package_bases = true

# Кэширование
cache_dir = ".mypy_cache"
sqlite_cache = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
allow_untyped_calls = true
ignore_missing_imports = true

